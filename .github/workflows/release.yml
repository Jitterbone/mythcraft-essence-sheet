name: Release Module

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Module Version & Determine Tag
        id: release-meta
        shell: bash
        run: |
          VERSION="$(jq -r .version module.json)"
          echo "version_number=$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" || "$TAG" == "refs/heads/"* ]]; then
            TAG="v${VERSION}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Update Manifest and Download URLs
        shell: bash
        run: |
          TAG="${{ steps.release-meta.outputs.tag_name }}"
          jq --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
             --arg download "https://github.com/${{ github.repository }}/releases/download/${TAG}/mythcraft-essence-sheet.zip" \
             '.manifest = $manifest | .download = $download' module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Create ZIP package
        run: |
          zip -r ./mythcraft-essence-sheet.zip . -x ".git/*" ".github/*" "dist/*" ".gitignore"
          cp ./mythcraft-essence-sheet.zip ./module.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: Version ${{ steps.release-meta.outputs.version_number }}
          prerelease: ${{ steps.release-meta.outputs.is_prerelease }}
          files: |
            ./mythcraft-essence-sheet.zip
            ./module.zip
            ./module.json

